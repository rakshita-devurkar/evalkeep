[project]
name = "evalkeep"
version = "0.1.0"
description = "Turn real AI-agent failures into reviewed regression tests."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "click>=8.5.0",
    "numpy>=2.4.6",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "typer>=0.27.2",
]

[project.optional-dependencies]
# Only needed to run the Anthropic analyzer; the pipeline works offline without it.
anthropic = ["anthropic>=1.0.0"]

[project.scripts]
evalkeep = "evalkeep.cli:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Typer declares options as argument defaults.
"src/evalkeep/cli.py" = ["B008"]

[tool.mypy]
# Deliberately not pinned to a python_version: mypy should analyse for the
# interpreter it is running on, and the CI matrix runs it on each supported
# version. Pinning to 3.11 made mypy reject numpy's own 3.12+ stubs when the
# venv was 3.12 or 3.13. `requires-python` above is what states the floor.
files = ["src", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Optional dependency: not installed in the default dev environment.
module = ["anthropic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scikit-learn and scipy ship no type information.
module = ["sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["evalkeep"]
branch = true
