name: Release

# Publishing is irreversible: a version can be yanked but never deleted, and the
# version number can never be reused. So this runs only on an explicit tag, and
# only after the same gates CI enforces.
on:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Check the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run --no-sync python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match pyproject version $version" >&2
            exit 1
          fi

      - run: uv build
      - run: uvx twine check dist/*

      - name: Install the built wheel and run the pipeline
        # The artifact is what users get, so it is what gets tested -- not the
        # working tree it was built from.
        run: |
          uv venv /tmp/clean --python 3.12
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          mkdir -p /tmp/smoke && cd /tmp/smoke
          # The wheel must report the tag, not just build under it.
          reported="$(/tmp/clean/bin/evalkeep --version)"
          if [ "$reported" != "${GITHUB_REF_NAME#v}" ]; then
            echo "wheel reports $reported, tag is ${GITHUB_REF_NAME#v}" >&2
            exit 1
          fi
          /tmp/clean/bin/evalkeep demo .
          /tmp/clean/bin/evalkeep init .
          /tmp/clean/bin/evalkeep ingest refund-agent/traces.jsonl
          /tmp/clean/bin/evalkeep detect
          /tmp/clean/bin/evalkeep ingest opentelemetry/spans.json --format otlp

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI verifies this workflow's identity directly, so
      # there is no long-lived token to leak.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-from-tag
        env:
          GH_TOKEN: ${{ github.token }}
